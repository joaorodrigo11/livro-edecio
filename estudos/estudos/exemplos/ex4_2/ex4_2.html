<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 4.2</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/jpg" href="img/livrojs.jpg">
</head>
<body>
    <img src="img/livrojs.jpg" alt="Livro JavaScript" width="100px">
    <h1>Programa de Cálculo do Peso Ideal</h1>
    <form>
        <p>Nome:
        <input type="text" id="inNome" name="nome" placeholder="Digite seu nome" required>
        </p>
        <p>Sexo:
        <input type="radio" id="inMasculino" name="sexo" required>Masculino
        <input type="radio" id="inFeminino" name="sexo" required>Feminino
        </p>
          <p>Altura (em metros):
        <input type="number" id="inAltura" name="altura" step="0.01" required>
        </p>
        <button type="submit">Calcular Peso Ideal</button>
        <button type="reset">Limpar Campos</button>
    </form>
    <h3></h3>
    <script src="ex4_2.js"></script>
</body>
</html>
